version: '3'
services:
  mrdoc:
    build: .
    volumes:
      - ./media:/app/MrDoc/media
      - ./log:/app/MrDoc/log
    ports:
      - "10086:10086"
    restart: always
    environment:
      - MRDOC_CONFIG=config-docker.ini
    dns:
      - 8.8.8.8
      - 114.114.114.114
    # command: ./run_dev_server.sh  # 取消注释以使用Django开发服务器进行调试