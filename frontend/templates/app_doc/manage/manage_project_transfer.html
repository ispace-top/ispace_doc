{% extends "base.html" %}
{% load static %}
{% load i18n %}
{% block title %}{% trans "文集转让" %}{% endblock %}

{% block content %}
<div class="ispace-page">
    <!-- Breadcrumb -->
    <div class="ispace-content-card" style="margin-bottom:var(--ispace-spacing-4);">
        <div style="padding:var(--ispace-spacing-3) var(--ispace-spacing-5);">
            <nav class="ispace-breadcrumb" aria-label="breadcrumb">
                <a href="{% url 'manage_project' %}" style="color:var(--ispace-color-text-secondary);text-decoration:none;">{% trans "文集管理" %}</a>
                <span style="color:var(--ispace-color-text-tertiary);margin:0 var(--ispace-spacing-2);">/</span>
                <a href="{% url 'modify_project' %}?pro_id={{ pro.id }}" style="color:var(--ispace-color-text-secondary);text-decoration:none;">{% trans "文集设置" %}</a>
                <span style="color:var(--ispace-color-text-tertiary);margin:0 var(--ispace-spacing-2);">/</span>
                <span style="color:var(--ispace-color-text);">{% trans "转让文集" %}</span>
            </nav>
        </div>
    </div>

    <div class="ispace-content-card">
        <div style="padding:var(--ispace-spacing-5);">
            <div style="margin-bottom:var(--ispace-spacing-4);">
                <span style="font-size:var(--ispace-font-size-lg);font-weight:var(--ispace-font-weight-semibold);">
                    {% trans "转让文集：" %}{{ pro.name }}
                </span>
            </div>
            <div class="ispace-form-group" style="max-width:400px;">
                <label class="ispace-form-label" for="user-select">{% trans "选择接收用户" %}</label>
                <select id="user-select" name="user-select" class="ispace-form-input">
                    <option value="">{% trans "选择用户，可搜索" %}</option>
                    {% for user in user_list %}
                    <option value="{{ user.username }}">{{ user.first_name }}({{ user.username }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="ispace-form-actions" style="margin-top:var(--ispace-spacing-4);">
                <button class="ispace-btn ispace-btn-primary" id="transfer-project">
                    {% trans "转让文集的管理权限及文档" %}
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    document.getElementById('transfer-project').addEventListener('click', function() {
        var username = document.getElementById('user-select').value;

        if (!username) {
            showWarning('{% trans "请选择接收用户" %}');
            return;
        }

        var loadingEl = document.createElement('div');
        loadingEl.className = 'ispace-loading-overlay';
        loadingEl.innerHTML = '<div class="ispace-spinner"></div>';
        document.body.appendChild(loadingEl);

        var data = new URLSearchParams();
        data.append('username', username);

        fetch('{% url "manage_pro_transfer" pro.id %}', {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: data.toString()
        })
        .then(function(r) { return r.json(); })
        .then(function(r) {
            loadingEl.remove();
            if (r.status) {
                showSuccess('{% trans "转让成功，即将返回文集列表……" %}');
                setTimeout(function() {
                    window.location.href = '{% url "manage_project" %}';
                }, 1500);
            } else {
                showError(r.data || '{% trans "转让失败" %}');
            }
        })
        .catch(function() {
            loadingEl.remove();
            showError('{% trans "转让异常" %}');
        });
    });
})();
</script>
{% endblock %}
