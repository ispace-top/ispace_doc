{% extends "base.html" %}
{% load static %}
{% load i18n %}
{% block title %}文档管理{% endblock %}

{% block styles %}
<style>
    .admin-doc-filter-row {
        display: flex;
        align-items: center;
        gap: var(--ispace-space-4);
        flex-wrap: wrap;
        margin-bottom: var(--ispace-space-3);
    }
    .admin-doc-filter-row .ispace-form-input {
        max-width: 240px;
    }
    .admin-doc-filter-row select {
        max-width: 280px;
    }
    .admin-doc-radio-group {
        display: flex;
        align-items: center;
        gap: var(--ispace-space-4);
    }
    .admin-doc-radio-group label {
        display: flex;
        align-items: center;
        gap: var(--ispace-space-1);
        font-size: var(--ispace-font-sm);
        cursor: pointer;
    }
    .doc-name-link {
        color: var(--ispace-color-text-link);
        text-decoration: none;
    }
    .doc-name-link:hover { text-decoration: underline; }
    .doc-badge-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
    }
    .doc-badge-dot.published { background: var(--ispace-color-brand-500); }
    .doc-badge-dot.draft { background: #f59e0b; }
    .doc-type-icon {
        color: var(--ispace-color-text-quaternary);
        margin-left: 4px;
        font-size: var(--ispace-font-xs);
    }
    .admin-doc-table-wrap { overflow-x: auto; }
    .doc-status-draft {
        cursor: pointer;
        color: #f59e0b;
    }
</style>
{% endblock %}

{% block content %}
<div class="ispace-page-header">
    <h1 class="ispace-page-title">文档管理</h1>
</div>

<div class="ispace-card ispace-mb-4">
    <div class="ispace-card-header">
        <h2 class="ispace-card-title">高级筛选</h2>
    </div>
    <div class="ispace-card-body">
        <div class="admin-doc-filter-row">
            <label class="ispace-form-label" style="margin-bottom:0;">关键词</label>
            <input type="text" id="doc-kw" placeholder="请输入标题" class="ispace-form-input">
            <button class="ispace-btn ispace-btn-primary ispace-btn-sm" id="search-btn">搜索</button>
        </div>
        <div class="admin-doc-filter-row">
            <label class="ispace-form-label" style="margin-bottom:0;">文集</label>
            <select id="project-select" class="ispace-form-input" style="max-width:280px;">
                <option value="">按文集筛选</option>
                {% for p in project_list %}
                    {% if p.role == 1 %}
                    <option value="{{ p.id }}">[私密]《{{ p.name }}》</option>
                    {% elif p.role == 2 %}
                    <option value="{{ p.id }}">[指定用户]《{{ p.name }}》</option>
                    {% elif p.role == 3 %}
                    <option value="{{ p.id }}">[访问码]《{{ p.name }}》</option>
                    {% else %}
                    <option value="{{ p.id }}">[公开]《{{ p.name }}》</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>
        <div class="admin-doc-filter-row">
            <label class="ispace-form-label" style="margin-bottom:0;">文档状态</label>
            <div class="admin-doc-radio-group">
                <label><input type="radio" name="doc-status" value="-1" checked> 全部({{ all_cnt }})</label>
                <label><input type="radio" name="doc-status" value="0"> 草稿({{ draft_doc_cnt }})</label>
                <label><input type="radio" name="doc-status" value="1"> 已发布({{ published_doc_cnt }})</label>
            </div>
        </div>
    </div>
</div>

<div class="ispace-card">
    <div class="ispace-card-body">
        <div class="ispace-flex-between ispace-mb-4">
            <div class="ispace-flex-center ispace-gap-3">
                <a class="ispace-btn ispace-btn-primary ispace-btn-sm" href="/create_doc/" target="_blank">新增</a>
                <button class="ispace-btn ispace-btn-danger ispace-btn-sm" id="batch-remove-btn">删除</button>
            </div>
            <div class="ispace-text-sm ispace-text-tertiary" id="doc-count-info"></div>
        </div>

        <div class="admin-doc-table-wrap">
            <table class="ispace-table" id="doc-table">
                <thead>
                    <tr>
                        <th style="width:36px;"><input type="checkbox" id="select-all-docs"></th>
                        <th>文档名称</th>
                        <th>状态</th>
                        <th>上级</th>
                        <th>文集</th>
                        <th>编辑模式</th>
                        <th>展开下级</th>
                        <th>文档作者</th>
                        <th>最后编辑</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="doc-table-body">
                </tbody>
            </table>
        </div>
        <div id="doc-pagination" class="ispace-pagination"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const API_URL = "{% url 'doc_manage' %}";
    const DEL_URL = "{% url 'del_doc' %}";
    const FAST_PUB_URL = "{% url 'fast_pub_doc' %}";
    const CSRF_TOKEN = document.querySelector('[name=csrfmiddlewaretoken]').value;
    const ITEMS_PER_PAGE = 10;
    let currentPage = 1;
    let currentFilters = { type: 1 };

    function getCSRFHeaders() {
        return {
            'X-CSRFToken': CSRF_TOKEN,
            'Content-Type': 'application/x-www-form-urlencoded',
        };
    }

    function formatDateTime(dateStr) {
        if (!dateStr) return '-';
        const d = new Date(dateStr);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    async function loadTable(page) {
        if (page === undefined) page = currentPage;
        currentPage = page;

        const body = new URLSearchParams();
        body.set('type', '1');
        body.set('page', page);
        body.set('limit', ITEMS_PER_PAGE);
        body.set('csrfmiddlewaretoken', CSRF_TOKEN);

        if (currentFilters.kw) body.set('kw', currentFilters.kw);
        if (currentFilters.project) body.set('project', currentFilters.project);
        if (currentFilters.status && currentFilters.status !== '-1') body.set('status', currentFilters.status);

        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: getCSRFHeaders(),
                body: body.toString()
            });
            const result = await resp.json();
            const rows = result.data || [];
            const count = result.count || 0;

            renderDocRows(rows);
            renderPagination(count, page);
            document.getElementById('doc-count-info').textContent = '共 ' + count + ' 条文档';
        } catch (err) {
            showError('获取文档列表失败');
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function renderDocRow(row) {
        let nameHtml = '';
        if (row.status == 1) {
            nameHtml = `<span class="doc-badge-dot published"></span><a class="doc-name-link" href="/project-${row.project_id}/doc-${row.id}" target="_blank">${escapeHtml(row.name)}</a>`;
        } else {
            nameHtml = `<span class="doc-badge-dot draft"></span><a class="doc-name-link" href="/modify_doc/${row.id}/" target="_blank" title="修改文档：${escapeHtml(row.name)}">${escapeHtml(row.name)}</a>`;
        }
        if (row.editor_mode == 4) {
            nameHtml += '<span class="doc-type-icon" title="表格文档">&#x2637;</span>';
        } else if ([1,2,3].includes(row.editor_mode)) {
            nameHtml += '<span class="doc-type-icon" title="普通文档">&#x1F4C4;</span>';
        }

        let statusHtml = '';
        if (row.status == 1) {
            statusHtml = '<span class="ispace-badge ispace-badge-success">已发布</span>';
        } else {
            statusHtml = `<span class="ispace-badge ispace-badge-warning doc-status-draft" data-action="publish" data-id="${row.id}" title="点击一键发布">草稿</span>`;
        }

        const editorModeMap = { 1: 'Editor.MD', 2: 'Vditor', 3: '富文本', 4: '在线表格' };
        const editorMode = editorModeMap[row.editor_mode] || '-';
        const openChildren = row.open_children ? '展开' : '收起';

        return `
            <tr data-doc-id="${row.id}">
                <td><input type="checkbox" class="doc-checkbox" value="${row.id}"></td>
                <td>${nameHtml}</td>
                <td>${statusHtml}</td>
                <td>${escapeHtml(row.parent || '-')}</td>
                <td>${escapeHtml(row.project_name || '-')}</td>
                <td>${editorMode}</td>
                <td>${openChildren}</td>
                <td>${escapeHtml(row.create_user || '-')}</td>
                <td class="ispace-text-sm">${formatDateTime(row.modify_time)}</td>
                <td>
                    <a href="/admin/doc_history_manage/${row.id}/" class="ispace-btn ispace-btn-sm ispace-btn-secondary" style="padding:2px 8px;" title="文档历史">&#x1F4C3;</a>
                    <button class="ispace-btn ispace-btn-danger ispace-btn-sm" data-action="delete" data-id="${row.id}" style="padding:2px 8px;">删除</button>
                </td>
            </tr>`;
    }

    function renderDocRows(rows) {
        const tbody = document.getElementById('doc-table-body');
        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="10" class="ispace-text-center ispace-text-tertiary" style="padding:40px;">暂无数据</td></tr>';
            return;
        }
        tbody.innerHTML = rows.map(renderDocRow).join('');
    }

    function renderPagination(count, page) {
        const container = document.getElementById('doc-pagination');
        const totalPages = Math.ceil(count / ITEMS_PER_PAGE) || 1;
        let html = '';

        html += `<button class="ispace-pagination-btn" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>上一页</button>`;

        const startPage = Math.max(1, page - 2);
        const endPage = Math.min(totalPages, page + 2);

        if (startPage > 1) {
            html += `<button class="ispace-pagination-btn" data-page="1">1</button>`;
            if (startPage > 2) html += '<span class="ispace-pagination-info">...</span>';
        }
        for (let i = startPage; i <= endPage; i++) {
            html += `<button class="ispace-pagination-btn ${i === page ? 'ispace-active' : ''}" data-page="${i}">${i}</button>`;
        }
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) html += '<span class="ispace-pagination-info">...</span>';
            html += `<button class="ispace-pagination-btn" data-page="${totalPages}">${totalPages}</button>`;
        }

        html += `<button class="ispace-pagination-btn" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''}>下一页</button>`;
        container.innerHTML = html;

        container.querySelectorAll('.ispace-pagination-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const p = parseInt(this.dataset.page);
                if (p >= 1 && p <= totalPages && p !== currentPage) {
                    loadTable(p);
                }
            });
        });
    }

    async function delDoc(docId) {
        const confirmed = await iSpaceDoc.confirm(
            '警告：此操作将删除此文档！',
            { title: '删除文档' }
        );
        if (!confirmed) return;

        const body = new URLSearchParams();
        body.set('doc_id', docId);
        body.set('csrfmiddlewaretoken', CSRF_TOKEN);

        try {
            const resp = await fetch(DEL_URL, {
                method: 'POST',
                headers: getCSRFHeaders(),
                body: body.toString()
            });
            const result = await resp.json();
            if (result.status) {
                showSuccess('删除成功');
                loadTable(currentPage);
            } else {
                showError(result.data || '删除失败');
            }
        } catch (err) {
            showError('删除失败');
        }
    }

    async function fastPubDoc(docId) {
        const body = new URLSearchParams();
        body.set('doc_id', docId);
        body.set('csrfmiddlewaretoken', CSRF_TOKEN);

        try {
            const resp = await fetch(FAST_PUB_URL, {
                method: 'POST',
                headers: getCSRFHeaders(),
                body: body.toString()
            });
            const result = await resp.json();
            if (result.status) {
                showSuccess('发布成功');
                loadTable(currentPage);
            } else {
                showError(result.data || '发布失败');
            }
        } catch (err) {
            showError('发布失败');
        }
    }

    async function batchRemoveDocs() {
        const checkboxes = document.querySelectorAll('.doc-checkbox:checked');
        if (checkboxes.length === 0) {
            showWarning('未选中任何文档');
            return;
        }
        const ids = Array.from(checkboxes).map(function(cb) { return cb.value; });
        const docIdStr = ids.join(',');

        const confirmed = await iSpaceDoc.confirm(
            '确定要删除这些文档？',
            { title: '提示' }
        );
        if (!confirmed) return;

        const body = new URLSearchParams();
        body.set('doc_id', docIdStr);
        body.set('range', 'multi');
        body.set('csrfmiddlewaretoken', CSRF_TOKEN);

        try {
            const resp = await fetch(DEL_URL, {
                method: 'POST',
                headers: getCSRFHeaders(),
                body: body.toString()
            });
            const result = await resp.json();
            if (result.status) {
                showSuccess('删除成功');
                loadTable(1);
            } else {
                showError(result.data || '删除失败');
            }
        } catch (err) {
            showError('删除失败');
        }
    }

    document.getElementById('doc-table-body').addEventListener('click', function(e) {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;

        const action = btn.dataset.action;
        const docId = btn.dataset.id;

        if (action === 'delete') {
            delDoc(docId);
        } else if (action === 'publish') {
            fastPubDoc(docId);
        }
    });

    document.getElementById('batch-remove-btn').addEventListener('click', batchRemoveDocs);

    document.getElementById('select-all-docs').addEventListener('change', function() {
        const checked = this.checked;
        document.querySelectorAll('.doc-checkbox').forEach(function(cb) {
            cb.checked = checked;
        });
    });

    document.getElementById('search-btn').addEventListener('click', function() {
        currentFilters.kw = document.getElementById('doc-kw').value.trim();
        loadTable(1);
    });

    document.getElementById('project-select').addEventListener('change', function() {
        currentFilters.project = this.value;
        loadTable(1);
    });

    document.querySelectorAll('input[name="doc-status"]').forEach(function(radio) {
        radio.addEventListener('change', function() {
            currentFilters.status = this.value;
            loadTable(1);
        });
    });

    loadTable(1);
})();
</script>
{% endblock %}
