{% load i18n %}{% load static %}
<aside class="ispace-sidebar" id="globalSidebar">
    <nav class="ispace-sidebar-nav" id="sidebarNav">
        <button class="ispace-sidebar-toggle" id="sidebarCollapse" title="{% trans '折叠侧边栏' %}" aria-label="折叠侧边栏">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        {% if sidebar_tree %}
            {% include "includes/sidebar_doc_node.html" with docs=sidebar_tree %}
        {% else %}
        <div class="ispace-sidebar-empty-state">
            <p class="ispace-text-sm ispace-text-quaternary">{% trans "暂无文档" %}</p>
        </div>
        {% endif %}
    </nav>
</aside>

{# ---- Context Menu ---- #}
<div class="ispace-context-menu" id="sidebarContextMenu" style="display:none;"></div>

<script>
(function(){
    // ---- SVG icons for tree toggle swapping ----
    var TREE_ICONS = {
        'folder-closed': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>',
        'folder-open': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>',
        'doc': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>'
    };

    function updateTreeIcon(toggle, state) {
        toggle.innerHTML = TREE_ICONS[state] || TREE_ICONS['doc'];
        toggle.setAttribute('data-icon-state', state);
    }

    // ---- Doc tree toggle: click icon → expand/collapse children ----
    document.getElementById('sidebarNav').addEventListener('click', function(e) {
        var toggle = e.target.closest('.ispace-tree-toggle');
        if (!toggle) return;
        if (toggle.getAttribute('data-has-children') !== '1') return;

        e.preventDefault();
        e.stopPropagation();

        var node = toggle.closest('.ispace-tree-node');
        var children = node.querySelector(':scope > .ispace-tree-children');
        if (!children) return;

        var expanded = toggle.getAttribute('data-expanded') === '1';
        if (expanded) {
            children.style.display = 'none';
            updateTreeIcon(toggle, 'folder-closed');
            toggle.setAttribute('data-expanded', '0');
        } else {
            children.style.display = 'block';
            updateTreeIcon(toggle, 'folder-open');
            toggle.setAttribute('data-expanded', '1');
        }
    });

    // ---- Sidebar collapse toggle ----
    var collapseBtn = document.getElementById('sidebarCollapse');
    var sidebar = document.getElementById('globalSidebar');
    if (collapseBtn && sidebar) {
        if (localStorage.getItem('sidebar-collapsed') === '1') {
            sidebar.classList.add('ispace-sidebar--collapsed');
        }
        collapseBtn.addEventListener('click', function(){
            var collapsed = sidebar.classList.toggle('ispace-sidebar--collapsed');
            localStorage.setItem('sidebar-collapsed', collapsed ? '1' : '0');
        });
    }

    // ---- Highlight current document & expand ancestor tree nodes ----
    (function(){
        var path = window.location.pathname;
        var proMatch = path.match(/^\/docs\/(\d+)\//);
        if (proMatch) {
            var pid = proMatch[1];
            var docMatch = path.match(/\/docs\/\d+\/(\d+)\//);
            if (docMatch) {
                // Doc page: highlight doc node + expand ancestors + expand own children
                var docLink = document.querySelector('.ispace-tree-link[href*="/docs/' + pid + '/' + docMatch[1] + '/"]');
                if (docLink) {
                    docLink.classList.add('ispace-active');
                    var node = docLink.closest('.ispace-tree-node');
                    // Expand current doc's own children
                    var ownChildren = node.querySelector(':scope > .ispace-tree-children');
                    if (ownChildren) {
                        ownChildren.style.display = 'block';
                        var ownToggle = node.querySelector(':scope > .ispace-tree-row > .ispace-tree-toggle');
                        if (ownToggle && ownToggle.getAttribute('data-has-children') === '1') {
                            updateTreeIcon(ownToggle, 'folder-open');
                            ownToggle.setAttribute('data-expanded', '1');
                        }
                    }
                    while (node) {
                        var childrenContainer = node.parentElement;
                        if (!childrenContainer || !childrenContainer.classList.contains('ispace-tree-children')) break;
                        childrenContainer.style.display = 'block';
                        var ancestorNode = childrenContainer.parentElement;
                        if (!ancestorNode || !ancestorNode.classList.contains('ispace-tree-node')) break;
                        var ancToggle = ancestorNode.querySelector(':scope > .ispace-tree-row > .ispace-tree-toggle');
                        if (ancToggle && ancToggle.getAttribute('data-has-children') === '1') {
                            updateTreeIcon(ancToggle, 'folder-open');
                            ancToggle.setAttribute('data-expanded', '1');
                        }
                        node = ancestorNode;
                    }
                }
            } else {
                // Root doc page: highlight the root tree node + expand children
                var proLink = document.querySelector('.ispace-tree-link[href$="/docs/' + pid + '/"]');
                if (proLink) {
                    proLink.classList.add('ispace-active');
                    var proNode = proLink.closest('.ispace-tree-node');
                    if (proNode) {
                        var childrenContainer = proNode.querySelector(':scope > .ispace-tree-children');
                        if (childrenContainer) {
                            childrenContainer.style.display = 'block';
                            var toggle = proNode.querySelector(':scope > .ispace-tree-row > .ispace-tree-toggle');
                            if (toggle && toggle.getAttribute('data-has-children') === '1') {
                                updateTreeIcon(toggle, 'folder-open');
                                toggle.setAttribute('data-expanded', '1');
                            }
                        }
                    }
                }
            }
        }
    })();

    // ---- Right-click Context Menu ----
    var contextMenu = document.getElementById('sidebarContextMenu');
    var currentContextTarget = null;

    var menuIcons = {
        'new-doc': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/><line x1="12" y1="13" x2="12" y2="19"/><line x1="9" y1="16" x2="15" y2="16"/></svg>',
        'rename-doc': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>',
        'delete-pro': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
        'delete-doc': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
        'new-doc-root': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/><line x1="12" y1="13" x2="12" y2="19"/><line x1="9" y1="16" x2="15" y2="16"/></svg>',
        'new-table-root': '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/><line x1="12" y1="3" x2="12" y2="21"/></svg>'
    };

    var menuCls = {
        'delete-pro': ' ispace-context-menu-item--danger',
        'delete-doc': ' ispace-context-menu-item--danger'
    };

    function showContextMenu(e, items) {
        e.preventDefault();
        e.stopPropagation();
        currentContextTarget = e.currentTarget;
        contextMenu.innerHTML = items.map(function(item) {
            var icon = menuIcons[item.action.split(':')[0]] || '';
            var cls = menuCls[item.action.split(':')[0]] || '';
            return '<button class="ispace-context-menu-item' + cls + '" data-action="' + item.action + '">' + icon + '<span>' + item.label + '</span></button>';
        }).join('');
        contextMenu.style.display = 'block';
        var x = e.clientX, y = e.clientY;
        var mw = contextMenu.offsetWidth || 170;
        var mh = contextMenu.offsetHeight || 200;
        if (x + mw > window.innerWidth) x = window.innerWidth - mw - 8;
        if (y + mh > window.innerHeight) y = window.innerHeight - mh - 8;
        contextMenu.style.left = x + 'px';
        contextMenu.style.top = y + 'px';
    }

    function hideContextMenu() {
        contextMenu.style.display = 'none';
        currentContextTarget = null;
    }

    // Determine current project ID from URL
    function getCurrentProId() {
        var m = window.location.pathname.match(/^\/docs\/(\d+)\//);
        return m ? m[1] : null;
    }

    // Check if user has any create permission in current project
    function canCreateInProject() {
        var rows = document.querySelectorAll('.ispace-tree-row');
        for (var i = 0; i < rows.length; i++) {
            var node = rows[i].parentElement;
            if (node && node.classList.contains('ispace-tree-node') && node.getAttribute('data-can-create') === '1') {
                return true;
            }
        }
        // Fallback: if authenticated and no rows (empty project), allow create
        return window.__ISPACEDOC__ && window.__ISPACEDOC__.isAuthenticated;
    }

    // Context menu on sidebar nav — tree rows + empty space
    document.getElementById('sidebarNav').addEventListener('contextmenu', function(e) {
        var row = e.target.closest('.ispace-tree-row');
        if (!row) {
            // ---- Empty space: create root-level doc ----
            if (!canCreateInProject()) return;
            var proId = getCurrentProId();
            var items = [];
            items.push({label: '新建文档', action: 'new-doc-root:' + (proId || '')});
            items.push({label: '新建表格', action: 'new-table-root:' + (proId || '')});
            showContextMenu(e, items);
            return;
        }

        var node = row.parentElement;
        if (!node.classList.contains('ispace-tree-node')) return;

        // 权限检查：无任何编辑权限则不弹出菜单
        var canCreate = node.getAttribute('data-can-create') === '1';
        var canManage = node.getAttribute('data-can-manage') === '1';
        if (!canCreate && !canManage) return;

        var docId = node.getAttribute('data-doc-id');
        var proId = node.getAttribute('data-pro-id');
        var items = [];
        if (canCreate) items.push({label: '新建子文档', action: 'new-child-doc:' + docId + ':' + proId});
        if (canManage) items.push({label: '重命名', action: 'rename-doc:' + docId + ':' + proId});
        if (canManage) items.push({label: '删除文档', action: 'delete-doc:' + docId + ':' + proId});
        if (items.length === 0) return;
        showContextMenu(e, items);
    });

    // Context menu action handling
    contextMenu.addEventListener('click', function(e) {
        var item = e.target.closest('.ispace-context-menu-item');
        if (!item) return;
        var action = item.getAttribute('data-action');
        var parts = action.split(':');
        var type = parts[0], id = parts[1], extra = parts[2];
        hideContextMenu();
        handleContextAction(type, id, extra);
    });

    function handleContextAction(type, id, extra) {
        var csrf = document.querySelector('[name=csrfmiddlewaretoken]');
        var csrfToken = csrf ? csrf.value : (window.__ISPACEDOC__ ? window.__ISPACEDOC__.csrfToken : '');
        function goto(url) {
            if (window.iSpaceDoc && window.iSpaceDoc.SPA) {
                window.iSpaceDoc.SPA.navigate(url);
            } else {
                window.location.href = url;
            }
        }
        if (type === 'new-doc') {
            goto('/docs/' + id + '/?create=1');
        } else if (type === 'new-doc-root') {
            // Create root-level doc (no parent_doc) in current project or home
            if (id) {
                goto('/docs/' + id + '/?create=1');
            } else {
                goto('/?create=1');
            }
        } else if (type === 'new-table-root') {
            if (id) {
                goto('/docs/' + id + '/?create=1&eid=4');
            } else {
                goto('/?create=1&eid=4');
            }
        } else if (type === 'new-child-doc') {
            goto('/docs/' + extra + '/' + id + '/?create_child=1');
        } else if (type === 'delete-doc') {
            if (!window.confirm('确认删除此文档？文档将被移入回收站。')) return;
            var fd = new FormData();
            fd.append('doc_id', id);
            fd.append('csrfmiddlewaretoken', csrfToken);
            // Check if the deleted doc is the currently viewed doc
            var isCurrentDoc = window.location.pathname.indexOf('/docs/' + extra + '/' + id + '/') !== -1;
            fetch('/del_doc/', {method:'POST', body:fd})
            .then(function(r) { return r.json(); })
            .then(function(r) {
                if (r.status) {
                    if (isCurrentDoc) {
                        goto('/docs/' + extra + '/'); // redirect to project root
                    } else {
                        window.location.reload();
                    }
                }
                else { alert(r.data); }
            });
        } else if (type === 'rename-doc') {
            var newName = prompt('请输入新名称：');
            if (!newName) return;
            var fd2 = new FormData();
            fd2.append('doc_id', id);
            fd2.append('project', extra);
            fd2.append('doc_name', newName);
            fd2.append('csrfmiddlewaretoken', csrfToken);
            fetch('/modify_doc/' + id + '/', {method:'POST', body:fd2})
            .then(function(r) { return r.json(); })
            .then(function(r) {
                if (r.status) { window.location.reload(); }
                else { alert(r.data || '重命名失败'); }
            });
        } else if (type === 'delete-pro') {
            if (!window.confirm('确认删除此文档及其所有子文档？此操作不可恢复！')) return;
            var fd3 = new FormData();
            fd3.append('project_id', id);
            fd3.append('csrfmiddlewaretoken', csrfToken);
            fetch('/del_project/', {method:'POST', body:fd3})
            .then(function(r) { return r.json(); })
            .then(function(r) {
                if (r.status) { window.location.href = '/'; }
                else { alert(r.data); }
            });
        } else if (type === 'rename-pro') {
            var newPName = prompt('请输入文档名称：');
            if (!newPName) return;
            var fd4 = new FormData();
            fd4.append('project_id', id);
            fd4.append('name', newPName);
            fd4.append('csrfmiddlewaretoken', csrfToken);
            fetch('/modify_pro/', {method:'POST', body:fd4})
            .then(function(r) { return r.json(); })
            .then(function(r) {
                if (r.status) { window.location.reload(); }
                else { alert(r.data || '重命名失败'); }
            });
        }
    }

    // Dismiss context menu on outside click
    document.addEventListener('click', hideContextMenu);
})();
</script>

<style>
/* ---- 侧边栏抽屉折叠按钮（边缘标签式）---- */
.ispace-sidebar-toggle {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 44px;
    border: 1px solid var(--ispace-color-border-medium);
    background: var(--ispace-color-surface-0);
    cursor: pointer;
    color: var(--ispace-color-text-quaternary);
    border-radius: var(--ispace-radius-md) 0 0 var(--ispace-radius-md);
    padding: 0;
    z-index: 10;
    opacity: 0.35;
    box-shadow: var(--ispace-shadow-xs);
    transition: opacity var(--ispace-duration-normal) var(--ispace-ease-out),
                color var(--ispace-duration-fast),
                background var(--ispace-duration-fast),
                box-shadow var(--ispace-duration-normal) var(--ispace-ease-out);
}
.ispace-sidebar-toggle svg { width: 16px; height: 16px; flex-shrink: 0; }
.ispace-sidebar-toggle:hover {
    opacity: 1;
    color: var(--ispace-color-text-primary);
    background: var(--ispace-color-surface-100);
    border-color: var(--ispace-color-border-strong);
    box-shadow: var(--ispace-shadow-sm);
}

/* ---- 文档树节点 ---- */
.ispace-tree-row {
    display: flex;
    align-items: center;
    gap: var(--ispace-space-1);
    border-radius: var(--ispace-radius-md);
    transition: background var(--ispace-duration-fast);
}
.ispace-tree-row:hover { background: var(--ispace-color-surface-100); }

.ispace-tree-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 28px;
    flex-shrink: 0;
    cursor: pointer;
    color: var(--ispace-color-text-quaternary);
    border-radius: var(--ispace-radius-sm);
    transition: color var(--ispace-duration-fast);
}
.ispace-tree-toggle svg { width: 14px; height: 14px; flex-shrink: 0; }
.ispace-tree-toggle:hover { color: var(--ispace-color-brand-500); }
.ispace-tree-toggle[data-has-children="0"] { cursor: default; }
.ispace-tree-toggle[data-has-children="0"]:hover { color: var(--ispace-color-text-quaternary); }

.ispace-tree-link {
    flex: 1;
    min-width: 0;
    padding: var(--ispace-space-1) var(--ispace-space-2);
    padding-left: 0;
}
.ispace-tree-link.ispace-active {
    background: var(--ispace-color-brand-50);
    color: var(--ispace-color-brand-500);
    font-weight: var(--ispace-font-medium);
}

.ispace-tree-children {
    padding-left: var(--ispace-space-5);
}

.ispace-sidebar-empty-state {
    padding: var(--ispace-space-4) 0;
    text-align: center;
}

/* 折叠侧边栏 */
.ispace-sidebar--collapsed {
    width: var(--ispace-sidebar-collapsed-width) !important;
    overflow: visible;
}
.ispace-sidebar--collapsed .ispace-tree-row,
.ispace-sidebar--collapsed .ispace-sidebar-empty-state { display: none; }
.ispace-sidebar--collapsed .ispace-sidebar-toggle {
    right: 50%;
    transform: translate(50%, -50%);
    border-radius: var(--ispace-radius-md);
    opacity: 0.7;
    width: 28px;
    height: 40px;
    border: 1px solid var(--ispace-color-border-light);
}
.ispace-sidebar--collapsed .ispace-sidebar-toggle:hover { opacity: 1; }
.ispace-sidebar--collapsed .ispace-sidebar-toggle svg { transform: rotate(180deg); }

/* 右键上下文菜单 */
.ispace-context-menu {
    position: fixed;
    z-index: 1100;
    min-width: 170px;
    background: var(--ispace-color-surface-0);
    border: 1px solid var(--ispace-color-border-medium);
    border-radius: var(--ispace-radius-lg);
    box-shadow: var(--ispace-shadow-lg);
    padding: var(--ispace-space-1);
    overflow: hidden;
}
.ispace-context-menu-item {
    display: flex;
    align-items: center;
    gap: var(--ispace-space-2);
    width: 100%;
    padding: var(--ispace-space-2) var(--ispace-space-3);
    font-size: var(--ispace-font-sm);
    font-weight: var(--ispace-font-normal);
    color: var(--ispace-color-text-secondary);
    background: none;
    border: none;
    border-radius: var(--ispace-radius-md);
    cursor: pointer;
    text-align: left;
    transition: all var(--ispace-duration-fast);
}
.ispace-context-menu-item svg {
    width: 14px; height: 14px;
    flex-shrink: 0;
    color: var(--ispace-color-text-quaternary);
    transition: color var(--ispace-duration-fast);
}
.ispace-context-menu-item:hover {
    background: var(--ispace-color-surface-100);
    color: var(--ispace-color-text-primary);
}
.ispace-context-menu-item:hover svg { color: var(--ispace-color-text-secondary); }
.ispace-context-menu-item--danger { color: var(--ispace-color-error-text); }
.ispace-context-menu-item--danger:hover {
    background: var(--ispace-color-error-bg);
    color: var(--ispace-color-error-text);
}
.ispace-context-menu-item--danger:hover svg { color: var(--ispace-color-error-text); }
.ispace-context-menu-item--danger svg { color: var(--ispace-color-error-text); opacity: 0.7; }
</style>
