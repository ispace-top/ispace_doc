[site]
debug = False
# 允许访问的域名，多个域名用英文逗号分隔，生产环境请设置为实际域名
allowed_hosts = localhost,127.0.0.1

[database]
engine = sqlite

[session]
cookie_age = 604800
browser_close = false
cookie_secure = false
cookie_httponly = true

[locale]
language = zh-hans
timezone = Asia/Shanghai

[cache]
backend = locmem
location = unique-snowflake

[search]
backend = whoosh

[storage]
backend = local

[email]
smtp_host =
smtp_port = 587
smtp_user =
smtp_password =
smtp_from = noreply@ispace.com

