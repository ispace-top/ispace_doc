{% extends "base.html" %}
{% load static %}
{% load i18n %}
{% block title %}文集权限管理{% endblock %}
{% block head_extra %}
<link href="{% static 'tagsInput/tagsinput.css' %}?version={{mrdoc_version}}" rel="stylesheet" type="text/css"/>
{% endblock %}
{% block content %}
<div class="ispace-page-header">
    <h1 class="ispace-page-title">修改文集权限</h1>
    <nav class="ispace-breadcrumb ispace-mt-2">
        <a href="{% url 'project_manage' %}">文集管理</a>
        <span class="ispace-breadcrumb-separator">/</span>
        <span>权限管理</span>
    </nav>
</div>

<div class="ispace-card">
    <div class="ispace-card-body">
        <form action="{% url 'admin_project_role' pro.id %}" method="post">
            {% csrf_token %}
            <div class="ispace-form-group">
                <label class="ispace-form-label">文集作者</label>
                <input type="text" value="{{pro.create_user.username}}" disabled class="ispace-form-input">
            </div>
            <div class="ispace-form-group">
                <label class="ispace-form-label">文集名称</label>
                <input type="text" value="{{pro.name}}" disabled class="ispace-form-input">
            </div>

            <div class="ispace-form-group">
                <label class="ispace-form-label">权限选择</label>
                <div class="ispace-flex-center ispace-gap-4">
                    <label class="ispace-form-check">
                        <input type="radio" name="role" value="0" {% if pro.role == 0 %}checked{% endif %}>
                        <span>公开</span>
                    </label>
                    <label class="ispace-form-check">
                        <input type="radio" name="role" value="1" {% if pro.role == 1 %}checked{% endif %}>
                        <span>私密</span>
                    </label>
                    <label class="ispace-form-check">
                        <input type="radio" name="role" value="2" {% if pro.role == 2 %}checked{% endif %}>
                        <span>指定用户可见</span>
                    </label>
                    <label class="ispace-form-check">
                        <input type="radio" name="role" value="3" {% if pro.role == 3 %}checked{% endif %}>
                        <span>访问码可见</span>
                    </label>
                </div>
            </div>

            <div class="ispace-form-group" id="role-pwd" style="{% if pro.role == 3 %}{% else %}display:none;{% endif %}">
                <label class="ispace-form-label">访问码</label>
                <div class="ispace-flex-center ispace-gap-2">
                    <input type="text" name="viewcode" placeholder="请输入访问码" autocomplete="off" class="ispace-form-input" value="{{pro.role_value}}" style="width: 240px;">
                    <span class="ispace-form-hint">不少于4位数</span>
                </div>
            </div>

            <div class="ispace-form-group" id="role-user" style="{% if pro.role == 2 %}{% else %}display:none;{% endif %}">
                <label class="ispace-form-label">允许用户</label>
                <div class="tagsinput-primary form-group">
                    <input name="tagsinput" id="tagsinputval" class="tagsinput" data-role="tagsinput" value="{{pro.role_value}}" placeholder="请输入用户名，回车输入多个用户">
                </div>
            </div>

            <div class="ispace-form-group">
                <button class="ispace-btn ispace-btn-primary" type="submit">立即修改</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'tagsInput/tagsinput.js' %}?version={{mrdoc_version}}" type="text/javascript" charset="utf-8"></script>
<script>
    (function() {
        var roleRadios = document.querySelectorAll('input[name="role"]');
        var rolePwd = document.getElementById('role-pwd');
        var roleUser = document.getElementById('role-user');

        function updateFields(value) {
            var v = parseInt(value);
            if (v === 0 || v === 1) {
                rolePwd.style.display = 'none';
                roleUser.style.display = 'none';
            } else if (v === 2) {
                rolePwd.style.display = 'none';
                roleUser.style.display = '';
            } else if (v === 3) {
                rolePwd.style.display = '';
                roleUser.style.display = 'none';
            }
        }

        for (var i = 0; i < roleRadios.length; i++) {
            roleRadios[i].addEventListener('change', function() {
                updateFields(this.value);
            });
        }
    })();
</script>
{% endblock %}
